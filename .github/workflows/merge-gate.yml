# PUBLIC — every PR triggers this workflow and the gate/merge check must be green to merge.
name: Merge Gate

on:
  pull_request:
    branches: [ main, develop ]
    # labeled/unlabeled are not in the default set. Without them the spec gate's
    # opt-out is one-way: label, push to trigger a run, get a green skip, then
    # remove the label — the same SHA keeps the stale green and merges without
    # either a spec or the label that excused it. Re-running the whole gate on a
    # label change costs a build, which is the cheaper side of that trade.
    # `edited` is here for retargeting: changing a PR's base branch fires that
    # and nothing else, so without it a PR moved from a feature base onto main
    # keeps a green verdict computed against the old base. It also fires on
    # title and body edits, which re-runs the build for nothing — the price of
    # not carrying a result that answers a question no longer being asked.
    types: [ opened, synchronize, reopened, labeled, unlabeled, edited ]

permissions:
  contents: read
  security-events: write

jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-build.yml@v2.7.1
    with:
      java-version: '25'
      flow-type: 'hybrid'
      docker-image: components-management-portal
    secrets: inherit

  quality:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-quality-gates.yml@v2.7.1
    with:
      java-version: '25'
    secrets: inherit

  security:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-security-reports.yml@v2.7.1
    with:
      java-version: '25'
      enable-codeql: false
      trivy-continue-on-error: true
    secrets: inherit

  # Spec discipline gate. Two checks: a behaviour change must carry a spec
  # delta, and the spec must have been committed before the implementation.
  # Rationale and the escape hatch are documented in AGENTS.md § Spec-first.
  spec-gate:
    name: spec / gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate reads commit ordering on the branch, not just the diff,
          # so the default shallow clone is not enough.
          fetch-depth: 0
      # The gate has its own suite; run it here so a broken gate fails loudly
      # instead of silently waving every PR through.
      - run: bash .github/scripts/spec-gate.test.sh
      - run: git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
      - run: .github/scripts/spec-gate.sh
        env:
          BASE_REF: origin/${{ github.base_ref }}
          # Behaviour = shipped Kotlin, SPA source, BFF configuration, and the
          # SPA build shell. src/main/resources carries gateway routes, CSRF
          # and security; vite.config.ts carries the production base path and
          # the deliberate absence of sourcemaps; index.html ships on every
          # load. Excluded: tests, test scaffolding and fixtures, and the
          # generated API surface (schema.d.ts, vendored v4.json) — those
          # follow a behaviour change rather than being one.
          #
          # Keep in exact parity with the constants in spec-gate.test.sh; the
          # suite fails if these drift.
          BEHAVIOR_RE: '^(src/main/(kotlin|resources)/|frontend/(src/|vite\.config\.ts$|index\.html$))'
          BEHAVIOR_EXCLUDE_RE: '(\.test\.(ts|tsx)$|^frontend/src/lib/api/(schema\.d\.ts|v4\.json)$|^frontend/src/test(-fixtures)?/)'
          SPEC_RE: '^(docs/features/|docs/architecture\.md$|docs/adr/|openspec/)'
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}

  frontend:
    name: frontend / lint-typecheck-coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Keep in exact parity with the gradle-node pin in build.gradle.kts.
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Wave 0 drift gate. Regenerates schema.d.ts from the vendored
      # v4.json and `diff`s against the committed copy — any uncommitted
      # delta between the spec and the generated types fails the PR.
      # Without this the script existed only as a local command and
      # contributors could re-vendor v4.json without regenerating.
      - run: npm run generate-types:check
      # Cross-repo staleness gate. `generate-types:check` only proves
      # schema.d.ts matches the *vendored* v4.json — not that the vendored
      # copy still matches CRS's published spec. This fetches CRS's spec at
      # the pinned ref (see scripts/vendor-spec.sh) and fails if Portal's
      # copy has fallen behind, so the contract can't silently drift between
      # the two repos. `gh` is preinstalled on the runner; GH_TOKEN lets it
      # read the public CRS repo without hitting the anonymous rate limit.
      - run: npm run vendor-spec:check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run test:coverage

  gate-merge:
    name: gate/merge
    needs: [ build, quality, security, frontend, spec-gate ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: octopusden/octopus-base/.github/actions/merge-gate@v2.7.1
        with:
          needs: ${{ toJson(needs) }}
