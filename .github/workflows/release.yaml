name: Gradle Release

on:
  repository_dispatch:
    types: release

jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@v2.5.1
    with:
      flow-type: hybrid
      java-version: '25'
      commit-hash: ${{ github.event.client_payload.commit }}
      build-version: ${{ github.event.client_payload.project_version }}
      docker-image: components-management-portal
      # The portal is a deployable app shipped as a docker image on ghcr; nothing
      # consumes it as a Maven dependency. Skip publishing its ~67 MB Spring Boot
      # fat-jar to Sonatype Central (was the single biggest Maven Central Release
      # Size contributor). publish-to-nexus landed in octopus-base v2.5.0; pinned
      # to v2.5.1, which also carries the Central Portal API publish fix.
      publish-to-nexus: false
      # Register the release in octopus-release-log directly at the end of this
      # run. The separate check-and-register workflow polled Maven Central for the
      # published jar — with publish-to-nexus=false that jar never appears, so that
      # path is removed (see deleted check-and-register.yml). The docker push above
      # is synchronous, so the release artifact (the image) already exists by here.
      register-release-immediately: true
    secrets: inherit
